name: Threads autopost

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '0 6 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dry_run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python api/autopost.py --dry-run

  publish:
    if: github.event_name == 'schedule' && github.event.schedule == '7,22,37,52 * * * *' && vars.AUTOPUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: threads-autopost-publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      THREADS_USERNAME: ${{ secrets.THREADS_USERNAME }}
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      AUTOPUBLISH_ENABLED: ${{ vars.AUTOPUBLISH_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - name: Block publication after unresolved queue persistence failure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
          CURRENT_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          def api(path):
              return json.loads(subprocess.check_output(
                  ["gh", "api", "--paginate", "--slurp", path], text=True))

          repo = os.environ["GH_REPO"]
          for page in api(f"repos/{repo}/actions/workflows/autopost.yml/runs?event=schedule&per_page=100"):
              for run in page["workflow_runs"]:
                  if run["conclusion"] == "success":
                      continue
                  base = f"repos/{repo}/actions/runs/{run['id']}"
                  if str(run["id"]) == os.environ["CURRENT_RUN"]:
                      paths = [base + f"/attempts/{attempt}/jobs?per_page=100"
                               for attempt in range(1, int(os.environ["CURRENT_ATTEMPT"]))]
                  else:
                      paths = [base + f"/attempts/{attempt}/jobs?per_page=100"
                               for attempt in range(1, run.get("run_attempt", 1) + 1)]
                  pages = [page for path in paths for page in api(path)]
                  for jobs_page in pages:
                      for job in jobs_page["jobs"]:
                          if job["name"] != "publish":
                              continue
                          steps = {step["name"]: step.get("conclusion") for step in job.get("steps", [])}
                          published = steps.get("Publish due posts")
                          persisted = steps.get("Commit queue statuses")
                          if "Publish due posts" in steps and published != "skipped" and (
                              published != "success" or persisted != "success"
                          ):
                              if published != "success":
                                  recovery = (
                                      "Publication outcome is uncertain. First inspect Threads to determine which posts "
                                      "actually published before editing the queue or resolving this run; a recovery "
                                      "artifact may not exist. Record the verified publication statuses in the queue. "
                                  )
                              else:
                                  recovery = (
                                      "Publication completed but status persistence failed. Merge statuses from the "
                                      "recovery artifact into the latest queue; restore any missing or renamed IDs "
                                      "with their recorded publication statuses. If the artifact is unavailable, "
                                      "inspect Threads and reconstruct the statuses before resolving this run. "
                                  )
                              sys.exit("Publication blocked: " + run["html_url"] + ". " + recovery
                                       + "Only after verified statuses are committed, delete the resolved failed run "
                                       "before publishing again.")
          PY
      - name: Publish due posts
        run: python api/autopost.py
      - name: Commit queue statuses
        id: persist
        if: always()
        run: |
          python - <<'PY'
          import csv
          import io
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys

          def git(*args, check=True):
              return subprocess.run(["git", *args], check=check, capture_output=True, text=True, encoding="utf-8")

          queue = Path("api/queue.csv")
          def read(text):
              return list(csv.DictReader(io.StringIO(text.lstrip("\ufeff")), delimiter=";"))

          before = {row["id"]: row["status"] for row in read(git("show", "HEAD:api/queue.csv").stdout)}
          rows = read(queue.read_text(encoding="utf-8-sig"))
          changes = {row["id"]: row["status"] for row in rows
                     if row["status"] and row["status"] != before.get(row["id"])}
          if not changes:
              sys.exit(0)
          shutil.copyfile(queue, Path(os.environ["RUNNER_TEMP"]) / "threads-queue-recovery.csv")
          git("config", "user.name", "github-actions[bot]")
          git("config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          branch = os.environ["GITHUB_REF_NAME"]
          for attempt in range(5):
              git("fetch", "origin", branch)
              git("reset", "--hard", "FETCH_HEAD")
              latest = read(queue.read_text(encoding="utf-8-sig"))
              missing = set(changes) - {row["id"] for row in latest}
              if missing:
                  sys.exit("Published queue IDs disappeared from the latest queue: "
                           + ", ".join(sorted(missing)) + ". Recover the queue artifact before publication.")
              for row in latest:
                  if row["id"] in changes:
                      row["status"] = changes[row["id"]]
              with queue.open("w", encoding="utf-8-sig", newline="") as file:
                  writer = csv.DictWriter(file, fieldnames=list(latest[0]), delimiter=";")
                  writer.writeheader()
                  writer.writerows(latest)
              git("add", "--", "api/queue.csv")
              if git("diff", "--cached", "--quiet", "--", "api/queue.csv", check=False).returncode == 0:
                  sys.exit(0)
              git("commit", "-m", "chore: update Threads queue statuses", "--", "api/queue.csv")
              if git("push", "origin", "HEAD:refs/heads/" + branch, check=False).returncode == 0:
                  sys.exit(0)
              print(f"Queue status push rejected; reconciling latest branch (attempt {attempt + 1}/5).")
          sys.exit("Queue statuses could not be pushed. Recover the queue artifact before further publication.")
          PY
      - name: Preserve queue for recovery
        if: failure() && steps.persist.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: threads-queue-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/threads-queue-recovery.csv
          retention-days: 90


  refresh:
    if: github.event_name == 'schedule' && github.event.schedule == '0 6 1,15 * *' && vars.AUTOPUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: threads-autopost-refresh-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Refresh token and update repository secret
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ.get("ACCESS_TOKEN", "").strip()
          if not token or not os.environ.get("GH_TOKEN"):
              sys.exit("ACCESS_TOKEN and GH_PAT must be configured.")
          query = urllib.parse.urlencode({
              "grant_type": "th_refresh_token",
              "access_token": token,
          })
          try:
              with urllib.request.urlopen(
                  "https://graph.threads.net/refresh_access_token?" + query,
                  timeout=60,
              ) as response:
                  refreshed = json.load(response).get("access_token")
          except urllib.error.HTTPError as error:
              sys.exit(f"Token refresh failed: HTTP {error.code}.")
          except (urllib.error.URLError, ValueError):
              sys.exit("Token refresh failed; no repository secret was changed.")
          if not isinstance(refreshed, str) or not refreshed or any(c in refreshed for c in "\r\n"):
              sys.exit("Token refresh did not return a valid access token.")
          print("::add-mask::" + refreshed, flush=True)
          subprocess.run(
              ["gh", "secret", "set", "ACCESS_TOKEN", "--repo", os.environ["GH_REPO"]],
              input=refreshed,
              text=True,
              check=True,
          )
          PY
